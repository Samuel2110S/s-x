<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Digital Map</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-color: #0b0f19;
        }

        header {
            background: #0f172a;
            padding: 15px 25px;
            border-bottom: 1px solid #1e293b;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .map-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        .leaflet-container {
            background: #0b0f19;
        }
    </style>
</head>
<body>

    <header>
        <h1>Global Digital Map Engine</h1>
    </header>

    <div id="map" class="map-container"></div>

    <script src="https://unpkg.com"></script>
    <script>
        const map = L.map('map', {
            minZoom: 2,
            maxZoom: 18,
            worldCopyJump: true
        }).setView([0, 0], 2);

        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);
    </script>
</body>
</html>
