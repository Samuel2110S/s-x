<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }

        .translator-container {
            background: #ffffff;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            margin-top: 10px;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            width: 100%;
        }

        select {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            outline: none;
            background-color: #fff;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        select:focus {
            border-color: #0969da;
        }

        .swap-btn {
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid #d0d7de;
            background-color: #f6f8fa;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .swap-btn:hover {
            background-color: #eaeef2;
        }

        .text-container {
            display: flex;
            gap: 16px;
            width: 100%;
        }

        .textarea-wrapper {
            flex: 1;
            min-width: 0;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            resize: vertical;
            outline: none;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: #0969da;
        }

        textarea[readonly] {
            background-color: #f6f8fa;
            color: #24292f;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .translator-container {
                padding: 14px;
                margin-top: 0;
            }

            .text-container {
                flex-direction: column;
                gap: 12px;
            }

            textarea {
                height: 130px;
            }

            select {
                font-size: 13px;
                padding: 8px;
            }

            .swap-btn {
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="translator-container">
        <div class="controls-bar">
            <select id="sourceLang"></select>
            <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
            <select id="targetLang"></select>
        </div>

        <div class="text-container">
            <div class="textarea-wrapper">
                <textarea id="inputText" placeholder="Type text..."></textarea>
            </div>
            <div class="textarea-wrapper">
                <textarea id="outputText" placeholder="Translation" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        const languages = {
            "auto": "Detect Language",
            "en": "English",
            "es": "Spanish",
            "fr": "French",
            "de": "German",
            "it": "Italian",
            "pt": "Portuguese",
            "zh-CN": "Chinese (Simplified)",
            "ja": "Japanese",
            "ko": "Korean",
            "ru": "Russian",
            "ar": "Arabic",
            "hi": "Hindi",
            "nl": "Dutch",
            "pl": "Polish",
            "tr": "Turkish",
            "uk": "Ukrainian",
            "vi": "Vietnamese"
        };

        const sourceLang = document.getElementById('sourceLang');
        const targetLang = document.getElementById('targetLang');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const swapBtn = document.getElementById('swapBtn');

        function populateDropdowns() {
            Object.entries(languages).forEach(([code, name]) => {
                const opt1 = new Option(name, code);
                sourceLang.add(opt1);

                if (code !== 'auto') {
                    const opt2 = new Option(name, code);
                    targetLang.add(opt2);
                }
            });

            sourceLang.value = 'en';
            targetLang.value = 'es';
        }

        populateDropdowns();

        let timer;
        inputText.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(translateText, 300);
        });

        sourceLang.addEventListener('change', translateText);
        targetLang.addEventListener('change', translateText);

        swapBtn.addEventListener('click', () => {
            if (sourceLang.value === 'auto') return;

            const tempLang = sourceLang.value;
            sourceLang.value = targetLang.value;
            targetLang.value = tempLang;

            const tempText = inputText.value;
            inputText.value = outputText.value;
            outputText.value = tempText;

            translateText();
        });

        async function translateText() {
            const text = inputText.value.trim();
            if (!text) {
                outputText.value = '';
                return;
            }

            outputText.placeholder = 'Translating...';

            const sl = sourceLang.value;
            const tl = targetLang.value;
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data && data[0]) {
                    const translatedText = data[0].map(item => item[0]).join('');
                    outputText.value = translatedText;
                } else {
                    outputText.value = 'Translation error.';
                }
            } catch (err) {
                outputText.value = 'Error connecting to translation engine.';
            }
        }
    </script>

</body>
</html>
